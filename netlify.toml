# Netlify build configuration for TreeHaus Woodworking
# Static site + a small prerender step (scripts/prerender.js) that bakes
# products.json/gallery.json into index.html at build time, so Snipcart's
# server-side order-validation crawler sees real prices/IDs instead of an
# empty JS-rendered <div>. See scripts/prerender.js for details.

[build]
  command = "node scripts/prerender.js"
  publish = "."

# Clean URLs (optional, nice-to-have)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Cache JSON lightly so CMS edits appear fast
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=60"
